name: strategylab

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: strategylab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strategylab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strategylab}
      POSTGRES_DB: ${POSTGRES_DB:-strategylab}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strategylab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: strategylab-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: strategylab-api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strategylab}:${POSTGRES_PASSWORD:-strategylab}@postgres:5432/${POSTGRES_DB:-strategylab}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-demo}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: strategylab-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
